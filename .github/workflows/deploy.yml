# Runs after CI passes on main (never on a red commit):
#   1. builds the images and pushes them to GitHub Container Registry (tag = git SHA)
#   2. deploys staging to Render, if the RENDER_DEPLOY_HOOK secret is set   (docs/render.md)
#   3. deploys to our own server over SSH, if the SSH_HOST secret is set      (docs/runbook.md)
# Manual "Run workflow": pick staging or production and, to roll back, an older SHA.
# Secrets live in the GitHub Environments "staging" and "production".
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'staging or production'
        required: true
        default: staging
        type: choice
        options: [staging, production]
      tag:
        description: 'Image tag (git SHA) to deploy. Empty = this commit. Use an older SHA to roll back.'
        required: false

permissions:
  contents: read
  packages: write

env:
  SHA: ${{ inputs.tag || github.event.workflow_run.head_sha || github.sha }}
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push')
      || (github.event_name == 'workflow_dispatch' && inputs.tag == '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { ref: '${{ env.SHA }}' }
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          {
            registry: ghcr.io,
            username: '${{ github.actor }}',
            password: '${{ secrets.GITHUB_TOKEN }}',
          }
      - name: Node image (api, worker, migrate)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.node
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/bookmarker-node:${{ env.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.web
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/bookmarker-web:${{ env.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Render image (web + API in one container)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.render
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/bookmarker-render:${{ env.SHA }}
            ${{ env.REGISTRY }}/bookmarker-render:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  render:
    needs: [build]
    if: >-
      always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
      && (inputs.environment || 'staging') == 'staging'
      && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: staging
    env:
      HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      - if: env.HOOK == ''
        run: echo "::notice::No RENDER_DEPLOY_HOOK secret yet; skipping Render (docs/render.md)."
      - name: Ask Render to deploy this image
        if: env.HOOK != ''
        run: |
          image="$REGISTRY/bookmarker-render:$SHA"
          curl -fsS -X POST "$HOOK&imgURL=$(jq -rn --arg v "$image" '$v|@uri')" -o /dev/null
          echo "Render is deploying $image"

  server:
    needs: [build]
    if: >-
      always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
      && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    env:
      # Until the server's secrets are added (docs/runbook.md), nothing is deployed
      # here, so the run stays green.
      HAS_SERVER: ${{ secrets.SSH_HOST != '' }}
    steps:
      - if: env.HAS_SERVER != 'true'
        run: echo "::notice::No SSH_HOST secret for this environment yet; skipping server deploy."
      - uses: actions/checkout@v7
        if: env.HAS_SERVER == 'true'
        with: { ref: '${{ env.SHA }}' }
      - name: Copy server files
        if: env.HAS_SERVER == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: 'infra/compose.server.yml,infra/Caddyfile,infra/backup'
          target: /opt/bookmarker
          strip_components: 1
      - name: Pull and restart (migrations run first, then api/worker)
        if: env.HAS_SERVER == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          TAG: ${{ env.SHA }}
          PROFILE: ${{ (inputs.environment || 'staging') == 'staging' && '--profile staging' || '' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: TAG,PROFILE
          script: |
            set -e
            cd /opt/bookmarker
            echo "TAG=$TAG" > .tag && cat .env .tag > .env.run
            docker compose -f compose.server.yml --env-file .env.run $PROFILE pull
            docker compose -f compose.server.yml --env-file .env.run $PROFILE up -d --remove-orphans
            sleep 10
            curl -fsS "https://$(grep ^DOMAIN= .env | cut -d= -f2)/healthz"
            echo "$TAG" >> deploy-history.log
