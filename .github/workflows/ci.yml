# Runs on every pull request and every push to main.
# Make these REQUIRED checks in GitHub → Settings → Branches → main:
#   "checks", "leak-test (AT-1)", "e2e", "security"
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://bookmarker:bookmarker@localhost:5432/bookmarker_test
  TEST_DATABASE_URL: postgresql://bookmarker:bookmarker@localhost:5432/bookmarker_test

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          { POSTGRES_USER: bookmarker, POSTGRES_PASSWORD: bookmarker, POSTGRES_DB: bookmarker_test }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U bookmarker" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: pnpm --filter @bookmarker/db migrate:deploy
      - name: Migrations match schema.prisma (drift check)
        run: pnpm --filter @bookmarker/db drift
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit, gate, API and worker tests
        run: pnpm test

  leak-test:
    name: leak-test (AT-1)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          { POSTGRES_USER: bookmarker, POSTGRES_PASSWORD: bookmarker, POSTGRES_DB: bookmarker_test }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U bookmarker" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bookmarker/db migrate:deploy
      - name: Spoiler leak sweep — HTTP, sockets, email (blocks merge)
        run: pnpm test:leak

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          {
            POSTGRES_USER: bookmarker,
            POSTGRES_PASSWORD: bookmarker,
            POSTGRES_DB: bookmarker_e2e_test,
          }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U bookmarker" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://bookmarker:bookmarker@localhost:5432/bookmarker_e2e_test
      E2E_DATABASE_URL: postgresql://bookmarker:bookmarker@localhost:5432/bookmarker_e2e_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bookmarker/db migrate:deploy
      - run: pnpm --filter @bookmarker/web exec playwright install --with-deps chromium
      - run: pnpm --filter @bookmarker/web e2e:build
      - name: Reading loop + accessibility (AT-15)
        run: pnpm --filter @bookmarker/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/web/playwright-report, retention-days: 7 }

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Known vulnerabilities in dependencies (high and above fail)
        run: pnpm audit --audit-level=high
      - name: OSV scanner (Google's open vulnerability database)
        uses: google/osv-scanner-action/osv-scanner-action@v2.2.3
        with:
          scan-args: --lockfile=pnpm-lock.yaml

  # Builds every image (amd64 only, not pushed) so a broken Dockerfile fails the
  # pull request instead of the deploy.
  docker-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          {
            POSTGRES_USER: bookmarker,
            POSTGRES_PASSWORD: bookmarker,
            POSTGRES_DB: bookmarker_smoke,
          }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U bookmarker" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Node image (api, worker, migrate)
        uses: docker/build-push-action@v6
        with:
          {
            context: .,
            file: infra/Dockerfile.node,
            push: false,
            cache-from: type=gha,
            cache-to: 'type=gha,mode=max',
          }
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          {
            context: .,
            file: infra/Dockerfile.web,
            push: false,
            cache-from: type=gha,
            cache-to: 'type=gha,mode=max',
          }
      - name: Render image (web + API in one container)
        uses: docker/build-push-action@v6
        with:
          {
            context: .,
            file: infra/Dockerfile.render,
            push: false,
            load: true,
            tags: bookmarker-render:ci,
            cache-from: type=gha,
            cache-to: 'type=gha,mode=max',
          }
      # Start it the way Render does (no extra privileges, no network access
      # needed at start-up) and check the site and API answer.
      - name: Render image starts and answers
        run: |
          docker run -d --name app --network host \
            --security-opt no-new-privileges --cap-drop ALL \
            -e PORT=10000 -e APP_URL=http://localhost:10000 -e COOKIE_SECURE=false \
            -e DATABASE_URL=postgresql://bookmarker:bookmarker@localhost:5432/bookmarker_smoke \
            -e SESSION_SECRET=smoke-test-secret-smoke-test-secret -e SMTP_URL=smtp://localhost:1025 \
            bookmarker-render:ci
          for i in $(seq 1 60); do
            if curl -fsS localhost:10000/healthz && curl -fsS -o /dev/null localhost:10000/signin; then
              echo; echo "up after ~$((i * 2)) s"; docker logs app 2>&1 | grep -ci 'corepack is about to download' && exit 1; exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' app)" != true ]; then break; fi
            sleep 2
          done
          docker logs app; exit 1
